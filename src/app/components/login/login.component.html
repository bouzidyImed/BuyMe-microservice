<div class="auth-page d-flex align-items-center justify-content-center min-vh-100 p-4">
  <div class="auth-card bg-white rounded shadow-lg p-4 p-md-5 animate-fade-up" style="max-width:420px; width:100%;">
    <div class="text-center mb-3">
      <h2 class="h4 mb-1">Welcome back to BuyMe</h2>
      <p class="text-muted small mb-0">Sign in to manage your account and orders</p>
    </div>

    <form (ngSubmit)="onLogin()" class="mt-4">
      <div class="mb-3">
        <label class="form-label small">Email</label>
        <input type="email" name="email" [(ngModel)]="credentials.email" required class="form-control form-control-lg" placeholder="you@example.com">
      </div>
      <div class="mb-3">
        <label class="form-label small">Password</label>
        <input type="password" name="password" [(ngModel)]="credentials.password" required class="form-control form-control-lg" placeholder="Your password">
      </div>
      <div class="d-flex justify-content-between align-items-center mb-3">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="rememberMe">
          <label class="form-check-label small" for="rememberMe">Remember me</label>
        </div>
        <a class="small" routerLink="/forgot-password">Forgot?</a>
      </div>

      <div *ngIf="message" class="alert alert-danger py-2">{{ message }}</div>

      <button type="submit" class="btn btn-primary w-100 btn-lg d-flex justify-content-center align-items-center" [disabled]="isLoading">
        <span *ngIf="!isLoading">Sign in</span>
        <span *ngIf="isLoading" class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
      </button>
    </form>

    <div class="text-center mt-3 small text-muted">Don't have an account? <a [routerLink]="['/register']">Register</a></div>
  </div>
</div>

<!-- Component-scoped simple animations -->
<style>
  .animate-fade-up{transform:translateY(8px);opacity:0;animation:fadeUp .38s ease-out forwards}
  @keyframes fadeUp{to{transform:none;opacity:1}}
  .auth-page{background:linear-gradient(180deg,#f8fafc, #fff)}
</style>
