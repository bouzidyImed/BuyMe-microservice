<div class="container py-5">
  <div class="page-header mb-4">
    <h1 class="h3 mb-0">My Orders</h1>
    <p class="text-muted">Review your recent purchases and order status.</p>
  </div>

  <div *ngIf="loading" class="text-center py-5">
    <div class="spinner-border text-primary" aria-hidden="true"></div>
    <span class="visually-hidden">Loading...</span>
  </div>

  <div *ngIf="error" class="alert alert-danger">{{ error }}</div>

  <div *ngIf="!loading && !error">
    <div *ngIf="orders.length === 0" class="alert alert-info">You have no orders yet.</div>

    <div class="row g-3">
      <div *ngFor="let o of orders" class="col-12">
        <div class="card shadow-sm">
          <div class="card-body d-flex justify-content-between align-items-center">
            <div>
              <h5 class="mb-1">Order #{{ o.id }}</h5>
              <div class="text-muted small">Placed: {{ o.orderDate | date:'medium' }}</div>
              <p class="mb-0 mt-2">Product ID: <strong>#{{ o.productId }}</strong> &nbsp; • &nbsp; Quantity: <strong>{{ o.qteOrdered }}</strong></p>
            </div>
            <div class="text-end">
              <span class="badge bg-info text-dark me-2">{{ o.status }}</span>
              <a class="btn btn-outline-primary btn-sm" [routerLink]="['/client/orders', o.id]">Details</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
