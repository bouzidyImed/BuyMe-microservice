server:
  port: 8084

spring:
  config:
    activate:
      on-profile: local

  datasource:
    url: jdbc:mysql://localhost:3306/e-com-catalogue-db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
    username: root
    password: ""
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.MySQL8Dialect

  kafka:
    bootstrap-servers: localhost:9092  # Or 'kafka:9092' if Docker-internal
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer  # Spring's JSON serializer
      properties:
        enable.idempotence: true  # Optional: Reliable delivery
    consumer:
      group-id: catalogue-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer  # Spring's JSON deserializer
      properties:
        spring.json.trusted.packages: "tn.iteam.catalogueservice.dto.*"  # For JSON DTOs
    admin:
      properties:
        auto.create.topics.enable: true  # Auto-creates topics on publish (default true, but explicit)

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka  # Points to your Eureka server

logging:
  level:
    org.springframework.kafka: DEBUG
    org.apache.kafka: DEBUG