spring:
  config:
    activate:
      on-profile: local

  application:
    name: catalogue-service

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/e-commerce

  datasource:
    url: jdbc:mysql://localhost:3306/e-com-catalogue-db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
    username: root
    password: ""
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect

server:
  port: 8084

keycloak:
  auth-server-url: http://localhost:8080
  realm: e-commerce
  resource: catalogue-service
  credentials:
    secret: hKMs68og1tJyS4qUm2EtbI6zkhgv2ePc
  use-resource-role-mappings: true
  bearer-only: true

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka

logging:
  level:
    org.springframework.security: DEBUG
    org.keycloak: DEBUG
    tn.iteam.catalogueservice: DEBUG
